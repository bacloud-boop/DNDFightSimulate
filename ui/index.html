<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>木桩训练场</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101b1b;color:#ede9d9;font:18px 'Microsoft YaHei',sans-serif}main{max-width:900px;margin:auto;padding:64px 36px}small{color:#a6b7a5;letter-spacing:4px}h1{font-size:48px;margin:18px 0}p{color:#a6b7a5;line-height:1.8}button{font:inherit;color:inherit;background:#223633;border:1px solid #506055;padding:16px 24px;border-radius:8px;cursor:pointer}button:hover{background:#345047}button:disabled{opacity:.4;cursor:wait}.menu{display:grid;gap:16px;max-width:420px;margin-top:40px}.primary{background:#b89856;color:#101b1b}.panel{background:#192925;border:1px solid #405347;border-radius:16px;padding:32px;margin:28px 0}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}progress{width:100%;height:24px;accent-color:#a9bc81}#dice{font-size:52px;color:#ddbd77;margin:20px 0}label{display:block;margin:28px 0}input{width:70%;accent-color:#b89856}#log{max-height:140px;overflow:auto;color:#b7c6b5;font-size:16px}section[hidden]{display:none}button:focus-visible{outline:3px solid #ddbd77}
</style><main><small>DND · COMBAT SIMULATOR</small>
<section id="home"><h1>木桩训练场</h1><p>一面骰子，一次攻击。<br>从这里开始你的战斗测试。</p><nav class="menu"><button class="primary" onclick="screen('battle')">进入战斗 →</button><button onclick="screen('settings')">设置</button><button onclick="quit()">退出游戏</button></nav></section>
<section id="battle" hidden><h1>训练战斗</h1><p>木桩仅被动承伤 · 每回合结束恢复满血</p><div class="panel"><div class="row"><h2>训练木桩</h2><span id="hp">1000 / 1000</span></div><progress id="health" value="1000" max="1000"></progress><p id="round">第 1 回合</p><div id="dice" aria-live="polite">D12 · 待投掷</div><div class="row"><button id="attack" class="primary" onclick="attack()">攻击 · 投掷 D12</button><button id="end" onclick="endRound()">结束回合</button></div><div id="log" role="log"></div></div><button id="back" onclick="screen('home')">← 返回主界面</button></section>
<section id="settings" hidden><h1>声音设置</h1><p>音量自动保存，下次启动继续使用。</p><div class="panel"><label>音乐音量 <output id="mv"></output><br><input id="music" type="range" min="0" max="100" aria-label="音乐音量"></label><label>音效音量 <output id="sv"></output><br><input id="sfx" type="range" min="0" max="100" aria-label="音效音量"></label><button onclick="sound()">试听投骰音效</button></div><button onclick="screen('home')">← 返回主界面</button></section></main><script src="app.js"></script></html>
